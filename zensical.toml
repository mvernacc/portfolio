[project]
site_name = "Matt Vernacchia's blog and portfolio"
site_description = "A portfolio of my engineering work."
site_author = "Matt Vernacchia"
site_url = "https://mvernacc.github.io/portfolio/"
copyright = "&copy; 2026 Matthew Vernacchia"
extra_css = ["stylesheets/portfolio.css"]
extra_javascript = [
  { path = "javascripts/ai_datacenter_project_finance_widget/ai-datacenter-project-finance-widget.js", type = "module" },
]
nav = [
  {"About" = "index.md"},
  {"Blog" = "blog.md"},
  {"Resume" = "assets/docs/resume_Matt_Vernacchia.pdf"},
  {"Publications" = "publications.md"},
  {"Projects" = [
    "hardware_projects.md",
    "software_projects.md",
  ]}
]
exclude_docs = """
work_in_progress/
"""

[project.theme]
variant = "classic"
features = [
    "content.footnote.tooltips"
]
